deployments:
  api:
    enabled: true
    image:
      repository: your-registry/itp-identity-service
      tag: "latest"
    replicaCount: 1
    port: 8080
    expose: true
    healthPath: /actuator/health
    ingress:
      enabled: true
      host: identity.yourdomain.com
      path: /
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      cpuUtilization: 70
      memoryUtilization: 80
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
    env:
      SPRING_PROFILES_ACTIVE: "default"

configmap:
  enabled: true
  data:
    JWT_EXPIRATION: "3600"
    JWT_ISSUER: "itp-identity"

secret:
  enabled: false
  data:
    JWT_SECRET: "change-me-in-prod"

serviceAccount:
  create: true
  name: ""
  annotations: {}

imagePullSecrets: []
imagePullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
