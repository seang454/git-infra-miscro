schedules:
  app:
    enabled: true
    schedule: "0 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    restartPolicy: OnFailure
    image:
      repository: your-registry/scheduler-service
      tag: "latest"
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env:
      SPRING_PROFILES_ACTIVE: "default"

serviceAccount:
  create: true
  name: ""
  annotations: {}

imagePullSecrets: []
imagePullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
