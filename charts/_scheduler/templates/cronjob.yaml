{{- range $name, $schedule := .Values.schedules }}
{{- if $schedule.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    component: {{ $name }}
spec:
  schedule: {{ $schedule.schedule | quote }}
  concurrencyPolicy: {{ $schedule.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $schedule.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $schedule.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ $.Values.serviceAccount.name | default $.Release.Name }}
          {{- if $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml $.Values.imagePullSecrets | nindent 12 }}
          {{- end }}
          {{- if $.Values.podSecurityContext }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- end }}
          restartPolicy: {{ $schedule.restartPolicy | default "OnFailure" }}
          containers:
            - name: {{ $name }}
              image: "{{ $schedule.image.repository }}:{{ $schedule.image.tag }}"
              imagePullPolicy: {{ $schedule.image.pullPolicy | default $.Values.imagePullPolicy | default "IfNotPresent" }}
              {{- if $.Values.securityContext }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              {{- end }}
              {{- if $schedule.env }}
              env:
                {{- range $k, $v := $schedule.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              {{- end }}
              {{- if $schedule.resources }}
              resources:
                {{- toYaml $schedule.resources | nindent 16 }}
              {{- end }}
          {{- if $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml $.Values.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.affinity }}
          affinity:
            {{- toYaml $.Values.affinity | nindent 12 }}
          {{- end }}
          {{- if $.Values.tolerations }}
          tolerations:
            {{- toYaml $.Values.tolerations | nindent 12 }}
          {{- end }}
---
{{- end }}
{{- end }}
