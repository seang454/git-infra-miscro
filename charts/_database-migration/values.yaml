migrations:
  app:
    enabled: true
    backoffLimit: 3
    restartPolicy: Never
    image:
      repository: your-registry/database-migration
      tag: "latest"
    command: []
    args: []
    env:
      SPRING_PROFILES_ACTIVE: "default"
    secret:
      enabled: false
      data:
        DB_URL: "jdbc:postgresql://postgres:5432/app"
        DB_USERNAME: "app"
        DB_PASSWORD: "change-me"

serviceAccount:
  create: true
  name: ""
  annotations: {}

imagePullSecrets: []
imagePullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
