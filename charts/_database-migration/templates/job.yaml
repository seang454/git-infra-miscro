{{- range $name, $migration := .Values.migrations }}
{{- if $migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    component: {{ $name }}
spec:
  backoffLimit: {{ $migration.backoffLimit | default 3 }}
  template:
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name | default $.Release.Name }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      restartPolicy: {{ $migration.restartPolicy | default "Never" }}
      containers:
        - name: {{ $name }}
          image: "{{ $migration.image.repository }}:{{ $migration.image.tag }}"
          imagePullPolicy: {{ $migration.image.pullPolicy | default $.Values.imagePullPolicy | default "IfNotPresent" }}
          {{- if $.Values.securityContext }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- end }}
          {{- if $migration.command }}
          command:
            {{- toYaml $migration.command | nindent 12 }}
          {{- end }}
          {{- if $migration.args }}
          args:
            {{- toYaml $migration.args | nindent 12 }}
          {{- end }}
          {{- if $migration.env }}
          env:
            {{- range $k, $v := $migration.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
      {{- if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $.Values.affinity }}
      affinity:
        {{- toYaml $.Values.affinity | nindent 8 }}
      {{- end }}
      {{- if $.Values.tolerations }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
