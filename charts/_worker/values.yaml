workers:
  app:
    enabled: true
    image:
      repository: your-registry/worker-service
      tag: "latest"
    replicaCount: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env:
      SPRING_PROFILES_ACTIVE: "default"
    configmap:
      enabled: false
      data: {}
    secret:
      enabled: false
      data: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

imagePullSecrets: []
imagePullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
