{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    component: {{ $name }}
    version: {{ $worker.image.tag | quote }}
spec:
  replicas: {{ $worker.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}
      component: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}
        component: {{ $name }}
        version: {{ $worker.image.tag | quote }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name | default $.Release.Name }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag }}"
          imagePullPolicy: {{ $worker.image.pullPolicy | default $.Values.imagePullPolicy | default "IfNotPresent" }}
          {{- if $.Values.securityContext }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- end }}
          {{- if $worker.env }}
          env:
            {{- range $k, $v := $worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if $worker.resources }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          {{- end }}
      {{- if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $.Values.affinity }}
      affinity:
        {{- toYaml $.Values.affinity | nindent 8 }}
      {{- end }}
      {{- if $.Values.tolerations }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
